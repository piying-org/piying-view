@let config = config2$.value();
@if (config) {
  @if (config.error) {
    <div class="alert alert-error text-sm">{{ config.error }}</div>
  } @else if (config.schema) {
    <piying-view
      [schema]="config.schema"
      [options]="options$$()"
      [model]="config.model"
    ></piying-view>
  }
}
